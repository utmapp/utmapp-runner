# Installed as /etc/ssh/sshd_config.d/010-ci-runner.conf by remote/10-system.sh.
#
# A drop-in rather than an edit to /etc/ssh/sshd_config, which macOS updates
# replace. sshd takes the first value it sees for each keyword, so this file
# must sort before Apple's 100-macos.conf.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
